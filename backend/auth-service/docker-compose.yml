version: '3.9'

services:
  auth-service:
    build: .
    container_name: auth-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://auth_user:auth_password@mysql:3306/auth_service
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - auth-net

  mysql:
    image: mysql:8.0
    container_name: auth-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auth_service
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - '3306:3306'
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot_password']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auth-net

  # Optional. Not required for basic authentication to work; the service
  # is designed to run without Redis until distributed rate limiting /
  # caching is needed.
  redis:
    image: redis:7-alpine
    container_name: auth-service-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - auth-net

volumes:
  auth_mysql_data:

networks:
  auth-net:
    driver: bridge
